<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NatureMax - Pro Wallpaper</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <style>
        body { font-family: sans-serif; margin: 0; background: #f8fafc; }
        nav { background: #fff; padding: 15px; text-align: center; border-bottom: 1px solid #eee; position: sticky; top: 0; z-index: 100; }
        .logo { font-size: 20px; font-weight: bold; color: #2e7d32; text-decoration: none; }
        .gallery { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; padding: 10px; }
        @media (min-width: 768px) { .gallery { grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); } }
        .card { background: #fff; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .card img { width: 100%; height: 250px; object-fit: cover; }
        .card-btns { padding: 8px; display: flex; gap: 5px; }
        .btn { flex: 1; padding: 8px; border-radius: 4px; font-size: 12px; text-align: center; text-decoration: none; font-weight: bold; }
        .btn-visit { background: #2e7d32; color: white; }
        .btn-share { background: #e2e8f0; color: #333; border: none; cursor: pointer; }
    </style>
</head>
<body>
    <nav><a href="#" class="logo">NatureMax</a></nav>
    <div class="gallery" id="gallery"></div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAd3zpyN-l6ugxFzw3ZqHvrsoWrifZt2QQ",
            authDomain: "nature-wallpaper-21afd.firebaseapp.com",
            projectId: "nature-wallpaper-21afd",
            storageBucket: "nature-wallpaper-21afd.firebasestorage.app",
            messagingSenderId: "794717954860",
            appId: "1:794717954860:web:c4a1e89272f9fc58314289"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        db.collection("wallpapers").orderBy("createdAt", "desc").onSnapshot((snapshot) => {
            const gallery = document.getElementById('gallery');
            gallery.innerHTML = "";
            snapshot.forEach((doc) => {
                const data = doc.data();
                gallery.innerHTML += `
                    <div class="card">
                        <img src="${data.url}">
                        <div class="card-btns">
                            <a href="${data.url}" target="_blank" class="btn btn-visit">Visit</a>
                            <button class="btn btn-share" onclick="sharePic('${data.url}')">Share</button>
                        </div>
                    </div>`;
            });
        });

        function sharePic(url) {
            if (navigator.share) {
                navigator.share({ title: 'Nature Wallpaper', url: url });
            } else {
                alert("Link: " + url);
            }
        }
    </script>
</body>
</html>
