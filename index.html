<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google-site-verification" content="C7ODWB-KBAHNqD_1GNnCj6kC4CTD9QlWOhXJTECnJ2I" />
    <title>Nature Wallpaper Gallery</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background-color: #f4f9f4; text-align: center; }
        header { background-color: #2e7d32; color: white; padding: 25px; font-size: 28px; font-weight: bold; }
        .upload-section { background: white; padding: 25px; border-radius: 15px; margin: 20px auto; width: 90%; max-width: 450px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); border-top: 5px solid #4caf50; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        button { background-color: #4caf50; color: white; border: none; padding: 14px; border-radius: 8px; cursor: pointer; width: 100%; font-size: 18px; font-weight: bold; }
        .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 25px; padding: 30px; }
        .card { background: white; border-radius: 15px; overflow: hidden; box-shadow: 0 6px 12px rgba(0,0,0,0.08); }
        .card img { width: 100%; height: 250px; object-fit: cover; }
        .card h3 { padding: 15px; margin: 0; color: #2e7d32; }
        #status { color: #2e7d32; font-weight: bold; margin-bottom: 10px; }
    </style>
</head>
<body>

<header>🌿 Nature Wallpaper Gallery</header>

<div class="upload-section">
    <h3>Upload Permanently</h3>
    <div id="status"></div>
    <input type="text" id="imgTitle" placeholder="Enter wallpaper title">
    <input type="file" id="imageInput" accept="image/*">
    <button onclick="uploadToCloudinary()">Publish to Gallery</button>
</div>

<div class="gallery" id="gallery"></div>

<script>
    // আপনার Cloudinary তথ্য এখানে বসানো হয়েছে
    const cloudName = "duu4w478s"; 
    const uploadPreset = "unsigned_preset"; // আপনার তৈরি করা 'Unsigned' প্রিসেট নামটি এখানে লিখুন

    async function uploadToCloudinary() {
        const fileInput = document.getElementById('imageInput');
        const titleInput = document.getElementById('imgTitle');
        const status = document.getElementById('status');
        const file = fileInput.files[0];

        if (!file) {
            alert("Please select a file first!");
            return;
        }

        status.innerText = "Uploading to Cloud... Please wait.";
        
        const formData = new FormData();
        formData.append('file', file);
        formData.append('upload_preset', uploadPreset);

        try {
            const response = await fetch(`https://api.cloudinary.com/v1_1/${cloudName}/image/upload`, {
                method: 'POST',
                body: formData
            });

            const data = await response.json();

            if (data.secure_url) {
                status.innerText = "Upload Successful!";
                addCardToGallery(data.secure_url, titleInput.value || "Untitled Nature");
                fileInput.value = "";
                titleInput.value = "";
            } else {
                status.innerText = "Upload failed. Check if your preset is 'Unsigned'.";
                console.log(data);
            }
        } catch (error) {
            status.innerText = "Error connecting to Cloudinary.";
            console.error(error);
        }
    }

    function addCardToGallery(url, title) {
        const gallery = document.getElementById('gallery');
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `<img src="${url}"><h3>${title}</h3>`;
        gallery.insertBefore(card, gallery.firstChild);
    }
</script>

</body>
</html>
