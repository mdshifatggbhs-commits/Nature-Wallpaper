<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nature Wallpaper</title>
    <style>
        body { margin: 0; font-family: Arial, sans-serif; background: #000; color: white; }
        
        /* Header & Logo */
        .navbar { display: flex; align-items: center; padding: 15px; background: #111; border-bottom: 1px solid #333; }
        .logo { width: 40px; height: 40px; border-radius: 50%; margin-right: 10px; }
        .site-name { font-size: 20px; font-weight: bold; }

        /* Gallery Grid */
        .gallery { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; padding: 15px; }
        .card { background: #1a1a1a; border-radius: 12px; overflow: hidden; cursor: pointer; }
        .card img { width: 100%; height: 250px; object-fit: cover; display: block; }

        /* Fullscreen Preview Modal */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 1000; flex-direction: column; align-items: center; justify-content: center; }
        .modal-content { width: 90%; max-width: 400px; background: #fff; border-radius: 15px; overflow: hidden; color: #333; position: relative; }
        .modal-content img { width: 100%; height: auto; display: block; }
        .close-modal { position: absolute; top: 10px; right: 15px; font-size: 25px; color: #fff; cursor: pointer; }

        /* Buttons in Modal */
        .btn-group { display: flex; padding: 15px; gap: 10px; }
        .btn { flex: 1; padding: 12px; border-radius: 8px; font-size: 14px; font-weight: bold; text-decoration: none; border: none; cursor: pointer; text-align: center; }
        .btn-download { background: #2e7d32; color: white; }
        .btn-share { background: #f1f5f9; color: #333; }
    </style>
</head>
<body>

    <div class="navbar">
        <img src="logo.png" class="logo" alt="Logo"> <span class="site-name">Wallpaper Max</span>
    </div>

    <div class="gallery" id="gallery">
        </div>

    <div id="imageModal" class="modal">
        <span class="close-modal" onclick="closePreview()">&times;</span>
        <div class="modal-content">
            <img id="modalImg" src="">
            <div class="btn-group">
                <a id="downloadLnk" href="" download class="btn btn-download">Download</a>
                <button class="btn btn-share" onclick="shareWallpaper()">Share</button>
            </div>
        </div>
    </div>

    <script>
        // Firebase snapshot (আপনার কোড অনুযায়ী)
        db.collection("wallpapers").orderBy("createdAt", "desc").onSnapshot((snapshot) => {
            const gallery = document.getElementById('gallery');
            gallery.innerHTML = "";
            snapshot.forEach((doc) => {
                const data = doc.data();
                gallery.innerHTML += `
                    <div class="card" onclick="openPreview('${data.url}')">
                        <img src="${data.url}">
                    </div>`;
            });
        });

        // ওপেন প্রিভিউ ফাংশন
        function openPreview(url) {
            document.getElementById('modalImg').src = url;
            document.getElementById('downloadLnk').href = url;
            document.getElementById('imageModal').style.display = "flex";
        }

        // ক্লোজ প্রিভিউ ফাংশন
        function closePreview() {
            document.getElementById('imageModal').style.display = "none";
        }

        // শেয়ার ফাংশন
        function shareWallpaper() {
            const url = document.getElementById('modalImg').src;
            if (navigator.share) {
                navigator.share({ title: 'Wallpaper', url: url });
            } else {
                alert("আপনার ব্রাউজার শেয়ার সাপোর্ট করছে না। লিঙ্কটি কপি করুন: " + url);
            }
        }
    </script>
</body>
</html>
