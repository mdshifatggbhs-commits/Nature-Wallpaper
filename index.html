<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <meta name="google-site-verification" content="C7ODWB-KBAHNqD_1GNnCj6kC4CTD9QlWOhXJTECnJ2I" />

    <title>Nature Wallpaper Gallery</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background-color: #f4f9f4; text-align: center; color: #1b5e20; }
        header { background-color: #2e7d32; color: white; padding: 25px; font-size: 28px; font-weight: bold; }
        .upload-section { background: white; padding: 25px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); display: inline-block; margin: 30px auto; width: 90%; max-width: 450px; border-top: 5px solid #4caf50; }
        input[type="text"], input[type="file"] { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #c8e6c9; border-radius: 8px; box-sizing: border-box; }
        button { background-color: #4caf50; color: white; border: none; padding: 14px; border-radius: 8px; cursor: pointer; width: 100%; font-size: 18px; font-weight: bold; }
        .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 25px; padding: 30px; }
        .card { background: white; border-radius: 15px; overflow: hidden; box-shadow: 0 6px 12px rgba(0,0,0,0.08); }
        .card img { width: 100%; height: 250px; object-fit: cover; }
        .card-info { padding: 15px; background: #fff; border-top: 1px solid #eee; }
        .card-info h3 { margin: 0; font-size: 18px; color: #2e7d32; }
    </style>
</head>
<body>

<header>🌿 Nature Wallpaper Gallery</header>

<div class="upload-section">
    <h3>Upload New Wallpaper</h3>
    <input type="text" id="imgTitle" placeholder="Enter wallpaper title (e.g. Green Forest)">
    <input type="file" id="imageInput" accept="image/*">
    <button onclick="addToGallery()">Publish to Gallery</button>
</div>

<div class="gallery" id="gallery">
    <p id="emptyMessage" style="color: #81c784; margin-top: 50px;">No wallpapers yet. Start uploading!</p>
</div>

<script>
    function addToGallery() {
        const input = document.getElementById('imageInput');
        const titleInput = document.getElementById('imgTitle');
        const gallery = document.getElementById('gallery');
        const emptyMessage = document.getElementById('emptyMessage');
        
        if (input.files && input.files[0]) {
            if (emptyMessage) emptyMessage.style.display = 'none';

            const reader = new FileReader();
            reader.onload = function(e) {
                const card = document.createElement('div');
                card.className = 'card';
                // Using the title from the input box
                const title = titleInput.value || "Untitled Nature"; 
                
                card.innerHTML = `
                    <img src="${e.target.result}" alt="${title}">
                    <div class="card-info">
                        <h3>${title}</h3>
                    </div>
                `;
                gallery.insertBefore(card, gallery.firstChild);
            }
            reader.readAsDataURL(input.files[0]);
            
            alert("Success! Wallpaper added.");
            input.value = ""; 
            titleInput.value = ""; // Clear the text box
        } else {
            alert("Please select an image!");
        }
    }
</script>

</body>
</html>
