<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <meta name="google-site-verification" content="C7ODWB-KBAHNqD_1GNnCj6kC4CTD9QlWOhXJTECnJ2I" />
    
    <title>Nature Wallpaper Gallery - MD Shifat</title>
    <meta name="description" content="Explore and download high-quality nature wallpapers for your phone.">

    <link rel="icon" type="image/png" href="https://img.icons8.com/color/48/natural-food.png">

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <style>
        :root { --primary: #2e7d32; --secondary: #4caf50; --bg: #f0f4f0; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; background-color: var(--bg); color: #333; }
        
        /* Header Style */
        header { background: linear-gradient(135deg, var(--primary), var(--secondary)); color: white; padding: 40px 20px; font-size: 32px; font-weight: bold; text-shadow: 2px 2px 4px rgba(0,0,0,0.2); border-bottom-left-radius: 30px; border-bottom-right-radius: 30px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        
        /* Upload Section */
        .upload-container { background: white; padding: 25px; border-radius: 20px; margin: -30px auto 30px; width: 85%; max-width: 500px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); position: relative; z-index: 10; }
        .upload-container h3 { margin-top: 0; color: var(--primary); }
        input[type="text"], input[type="file"] { width: 100%; padding: 12px; margin: 10px 0; border: 1.5px solid #ddd; border-radius: 10px; box-sizing: border-box; outline: none; transition: 0.3s; }
        input[type="text"]:focus { border-color: var(--secondary); }
        
        .btn-main { background-color: var(--primary); color: white; border: none; padding: 15px; border-radius: 10px; cursor: pointer; width: 100%; font-size: 18px; font-weight: bold; transition: 0.3s; box-shadow: 0 4px 10px rgba(46, 125, 50, 0.3); }
        .btn-main:hover { background-color: #1b5e20; transform: translateY(-2px); }

        /* Gallery Card Style */
        .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; padding: 20px; }
        .card { background: white; border-radius: 18px; overflow: hidden; box-shadow: 0 5px 15px rgba(0,0,0,0.05); transition: 0.3s; border: 1px solid #eee; }
        .card:hover { transform: scale(1.02); box-shadow: 0 8px 25px rgba(0,0,0,0.1); }
        .card img { width: 100%; height: 350px; object-fit: cover; cursor: pointer; }
        .card-content { padding: 15px; text-align: left; }
        .card h3 { margin: 0 0 10px; font-size: 18px; color: #444; }
        
        .btn-download { display: block; text-align: center; background-color: #f5f5f5; color: var(--primary); text-decoration: none; padding: 10px; border-radius: 8px; font-weight: bold; font-size: 14px; border: 1px solid var(--primary); transition: 0.3s; }
        .btn-download:hover { background-color: var(--primary); color: white; }

        #status { font-weight: bold; margin-bottom: 15px; font-size: 14px; color: #666; }
    </style>
</head>
<body>

<header>
    <img src="https://img.icons8.com/color/48/natural-food.png" alt="logo" style="vertical-align: middle; margin-right: 10px;">
    Nature Gallery
</header>

<div class="upload-container">
    <h3>Post New Wallpaper</h3>
    <div id="status">Ready to share your capture?</div>
    <input type="text" id="imgTitle" placeholder="Wallpaper Name (Ex: Sunrise)">
    <input type="file" id="imageInput" accept="image/*">
    <button class="btn-main" onclick="publishWallpaper()">Publish to Gallery</button>
</div>

<div id="gallery" class="gallery"></div>

<script>
    // Firebase Config
    const firebaseConfig = {
        apiKey: "AIzaSyAd3zpyN-l6ugxFzw3ZqHvrsoWrifZt2QQ",
        authDomain: "nature-wallpaper-21afd.firebaseapp.com",
        projectId: "nature-wallpaper-21afd",
        storageBucket: "nature-wallpaper-21afd.firebasestorage.app",
        messagingSenderId: "794717954860",
        appId: "1:794717954860:web:c4a1e89272f9fc58314289"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // Cloudinary Config
    const cloudName = "duu4w478s"; 
    const uploadPreset = "nature_preset"; 

    // ডাটাবেস থেকে ছবি রিয়েল-টাইমে দেখানো
    db.collection("wallpapers").orderBy("createdAt", "desc").onSnapshot((snapshot) => {
        const galleryDiv = document.getElementById('gallery');
        galleryDiv.innerHTML = "";
        snapshot.forEach((doc) => {
            const data = doc.data();
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <img src="${data.url}" onclick="window.open('${data.url}', '_blank')">
                <div class="card-content">
                    <h3>${data.title}</h3>
                    <a href="${data.url}" download class="btn-download">⬇ Download HD</a>
                </div>
            `;
            galleryDiv.appendChild(card);
        });
    });

    async function publishWallpaper() {
        const fileInput = document.getElementById('imageInput');
        const titleInput = document.getElementById('imgTitle');
        const status = document.getElementById('status');
        const file = fileInput.files[0];

        if (!file) { alert("Please select an image!"); return; }

        status.innerText = "⏳ Uploading to Cloud...";
        status.style.color = "#f57c00";

        const formData = new FormData();
        formData.append('file', file);
        formData.append('upload_preset', uploadPreset);

        try {
            const res = await fetch(`https://api.cloudinary.com/v1_1/${cloudName}/image/upload`, {
                method: 'POST', body: formData
            });
            const data = await res.json();

            if (data.secure_url) {
                status.innerText = "💾 Saving to Database...";
                await db.collection("wallpapers").add({
                    url: data.secure_url,
                    title: titleInput.value || "Nature View",
                    createdAt: new Date()
                });
                status.innerText = "✅ Successfully Published!";
                status.style.color = "#2e7d32";
                fileInput.value = ""; titleInput.value = "";
            }
        } catch (e) {
            status.innerText = "❌ Connection Error!";
        }
    }
</script>
</body>
</html>
