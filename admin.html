<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - NatureMax HD</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #ffffff; color: #333; padding: 20px; margin: 0; }
        .container { max-width: 500px; margin: auto; text-align: center; }
        .box { background: #fbfbfb; padding: 30px; border-radius: 12px; border: 1px solid #eee; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        h2 { color: #2e7d32; margin-bottom: 20px; }
        input, button { width: 100%; padding: 12px; margin: 10px 0; border-radius: 8px; border: 1px solid #ddd; box-sizing: border-box; font-size: 14px; }
        button { background: #2e7d32; color: white; border: none; font-weight: bold; cursor: pointer; transition: 0.3s; }
        button:hover { background: #1b5e20; }
        
        /* Admin Gallery Style */
        .admin-gallery { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 30px; }
        .admin-card { position: relative; border-radius: 8px; overflow: hidden; border: 1px solid #eee; background: #fff; }
        .admin-card img { width: 100%; height: 100px; object-fit: cover; }
        .del-btn { position: absolute; top: 0; right: 0; background: #ff4444; color: white; border: none; padding: 5px 8px; font-size: 12px; cursor: pointer; border-radius: 0 0 0 8px; }
        
        #status { font-size: 13px; color: #666; margin-top: 5px; }
        .nav-link { display: inline-block; margin-top: 15px; color: #2e7d32; text-decoration: none; font-size: 14px; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <div id="loginBox" class="box">
        <h2>Admin Login</h2>
        <input type="password" id="passInput" placeholder="Password (1234)">
        <button onclick="doLogin()">Login</button>
    </div>

    <div id="adminContent" style="display:none;">
        <div class="box">
            <h2>Upload Wallpaper</h2>
            <p id="status">Ready</p>
            <input type="text" id="imgTitle" placeholder="Title">
            <input type="file" id="imageFile" accept="image/*">
            <button onclick="uploadImage()">Publish</button>
            <a href="index.html" class="nav-link">← Go to Website</a>
        </div>

        <h3 style="margin-top:40px;">Manage Wallpapers</h3>
        <div id="adminList" class="admin-gallery">
            </div>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyAd3zpyN-l6ugxFzw3ZqHvrsoWrifZt2QQ",
        authDomain: "nature-wallpaper-21afd.firebaseapp.com",
        projectId: "nature-wallpaper-21afd",
        storageBucket: "nature-wallpaper-21afd.firebasestorage.app",
        messagingSenderId: "794717954860",
        appId: "1:794717954860:web:c4a1e89272f9fc58314289"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // Login (Password: 1234)
    function doLogin() {
        if(document.getElementById('passInput').value === "1234") {
            document.getElementById('loginBox').style.display = 'none';
            document.getElementById('adminContent').style.display = 'block';
            loadImages(); // ছবি লোড হবে
        } else { alert("Wrong Password!"); }
    }

    // Upload function
    async function uploadImage() {
        const file = document.getElementById('imageFile').files[0];
        if(!file) return alert("Select a file!");

        document.getElementById('status').innerText = "Uploading...";
        const formData = new FormData();
        formData.append('file', file);
        formData.append('upload_preset', "nature_preset");

        try {
            const res = await fetch(`https://api.cloudinary.com/v1_1/duu4w478s/image/upload`, { method: 'POST', body: formData });
            const data = await res.json();
            if(data.secure_url) {
                await db.collection("wallpapers").add({
                    url: data.secure_url,
                    title: document.getElementById('imgTitle').value || "HD",
                    createdAt: new Date()
                });
                alert("Published!");
                location.reload();
            }
        } catch (err) { alert("Upload Failed!"); }
    }

    // Load and Delete Images
    function loadImages() {
        db.collection("wallpapers").orderBy("createdAt", "desc").onSnapshot(snap => {
            const list = document.getElementById('adminList');
            list.innerHTML = "";
            snap.forEach(doc => {
                list.innerHTML += `
                    <div class="admin-card">
                        <img src="${doc.data().url}">
                        <button class="del-btn" onclick="deleteImg('${doc.id}')">Delete</button>
                    </div>`;
            });
        });
    }

    async function deleteImg(id) {
        if(confirm("Delete this?")) { await db.collection("wallpapers").doc(id).delete(); }
    }
</script>
</body>
</html>
