<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Manage Wallpapers</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <style>
        body { font-family: sans-serif; background: #fff; padding: 20px; text-align: center; }
        .box { max-width: 400px; margin: auto; padding: 20px; border: 1px solid #ddd; border-radius: 10px; }
        input, button { width: 100%; padding: 10px; margin: 10px 0; border-radius: 5px; border: 1px solid #ccc; }
        button { background: #2e7d32; color: #fff; font-weight: bold; border: none; cursor: pointer; }
        .admin-gallery { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; margin-top: 20px; }
        .admin-card { position: relative; border: 1px solid #eee; }
        .admin-card img { width: 100%; height: 80px; object-fit: cover; }
        .del-btn { position: absolute; top: 0; right: 0; background: red; color: white; border: none; cursor: pointer; padding: 2px 6px; font-size: 10px; border-radius: 3px; }
    </style>
</head>
<body>
    <div id="loginBox" class="box">
        <h3>Admin Login</h3>
        <input type="password" id="pass" placeholder="Password">
        <button onclick="login()">Login</button>
    </div>

    <div id="uploadBox" style="display:none;">
        <div class="box">
            <h3>Upload New Pic</h3>
            <input type="text" id="title" placeholder="Title">
            <input type="file" id="file">
            <button onclick="upload()">Upload & Publish</button>
            <a href="index.html">Back Home</a>
        </div>

        <h3>Your Uploaded Pics (Manage/Delete)</h3>
        <div id="adminList" class="admin-gallery"></div>
    </div>

    <script>
        const firebaseConfig = { /* আপনার একই Config এখানে দিন */ };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        function login() {
            if(document.getElementById('pass').value === "1234") {
                document.getElementById('loginBox').style.display = "none";
                document.getElementById('uploadBox').style.display = "block";
                loadAdminPics();
            } else { alert("Wrong!"); }
        }

        async function upload() {
            const file = document.getElementById('file').files[0];
            const title = document.getElementById('title').value;
            if(!file) return alert("Select Pic");

            const formData = new FormData();
            formData.append('file', file);
            formData.append('upload_preset', "nature_preset");

            const res = await fetch(`https://api.cloudinary.com/v1_1/duu4w478s/image/upload`, { method: 'POST', body: formData });
            const data = await res.json();

            if(data.secure_url) {
                await db.collection("wallpapers").add({ url: data.secure_url, title: title || "Nature", createdAt: new Date() });
                alert("Success!");
            }
        }

        function loadAdminPics() {
            db.collection("wallpapers").orderBy("createdAt", "desc").onSnapshot(snap => {
                const list = document.getElementById('adminList');
                list.innerHTML = "";
                snap.forEach(doc => {
                    const d = doc.data();
                    list.innerHTML += `
                        <div class="admin-card">
                            <img src="${d.url}">
                            <button class="del-btn" onclick="deletePic('${doc.id}')">Delete</button>
                        </div>`;
                });
            });
        }

        async function deletePic(id) {
            if(confirm("Delete this pic?")) {
                await db.collection("wallpapers").doc(id).delete();
            }
        }
    </script>
</body>
</html>
