<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - MD Shifat</title>
    
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f0f4f0; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .admin-box { background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); width: 90%; max-width: 400px; text-align: center; }
        h2 { color: #2e7d32; margin-bottom: 20px; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 10px; box-sizing: border-box; }
        button { background-color: #2e7d32; color: white; border: none; padding: 15px; border-radius: 10px; width: 100%; font-weight: bold; cursor: pointer; font-size: 16px; }
        #status { margin-top: 15px; font-weight: bold; font-size: 14px; }
        .back-link { display: block; margin-top: 20px; color: #666; text-decoration: none; font-size: 14px; }
    </style>
</head>
<body>

<div class="admin-box" id="loginBox">
    <h2>Admin Login</h2>
    <input type="password" id="adminPass" placeholder="Enter Secret Password">
    <button onclick="checkPass()">Login to Upload</button>
</div>

<div class="admin-box" id="uploadBox" style="display:none;">
    <h2>Upload New Wallpaper</h2>
    <div id="status">Ready</div>
    <input type="text" id="imgTitle" placeholder="Wallpaper Title (Ex: Green Hill)">
    <input type="file" id="imageInput" accept="image/*">
    <button onclick="publishWallpaper()">Publish to Gallery</button>
    <a href="index.html" class="back-link">← Back to Public Gallery</a>
</div>

<script>
    // Firebase Configuration (আপনার আগের সেই একই তথ্য এখানে বসাবেন)
    const firebaseConfig = {
        apiKey: "AIzaSyAd3zpyN-l6ugxFzw3ZqHvrsoWrifZt2QQ",
        authDomain: "nature-wallpaper-21afd.firebaseapp.com",
        projectId: "nature-wallpaper-21afd",
        storageBucket: "nature-wallpaper-21afd.firebasestorage.app",
        messagingSenderId: "794717954860",
        appId: "1:794717954860:web:c4a1e89272f9fc58314289"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // Cloudinary Config
    const cloudName = "duu4w478s"; 
    const uploadPreset = "nature_preset"; 

    // পাসওয়ার্ড চেক
    function checkPass() {
        const pass = document.getElementById('adminPass').value;
        if (pass === "1234") { // এটি আপনার পাসওয়ার্ড, চাইলে পরিবর্তন করতে পারেন
            document.getElementById('loginBox').style.display = "none";
            document.getElementById('uploadBox').style.display = "block";
        } else {
            alert("Wrong Password!");
        }
    }

    // আপলোড ফাংশন
    async function publishWallpaper() {
        const fileInput = document.getElementById('imageInput');
        const titleInput = document.getElementById('imgTitle');
        const status = document.getElementById('status');
        const file = fileInput.files[0];

        if (!file) return alert("Select an image!");

        status.innerText = "Processing... Wait";
        status.style.color = "orange";

        const formData = new FormData();
        formData.append('file', file);
        formData.append('upload_preset', uploadPreset);

        try {
            const res = await fetch(`https://api.cloudinary.com/v1_1/${cloudName}/image/upload`, {
                method: 'POST', body: formData
            });
            const data = await res.json();

            if (data.secure_url) {
                await db.collection("wallpapers").add({
                    url: data.secure_url,
                    title: titleInput.value || "Nature View",
                    createdAt: new Date()
                });
                status.innerText = "✅ Published Successfully!";
                status.style.color = "green";
                fileInput.value = ""; titleInput.value = "";
            }
        } catch (e) {
            status.innerText = "❌ Upload Failed!";
            status.style.color = "red";
        }
    }
</script>
</body>
</html>
